<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#001a4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Playbook">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Clarkston Playbook</title>
<style>:root{--bg:#0a1f44;--panel:#001a4d;--panel2:#002a7a;--line:#23407e;--text:#f2f4f7;--muted:#a9b6d6;--acc:#ffc72c;--accText:#0a1f44;--danger:#d93a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{filter:brightness(1.3)}
button.on{background:var(--acc);color:var(--accText);border-color:var(--acc);font-weight:700}
button.pri{background:var(--acc);color:var(--accText);border-color:var(--acc);font-weight:700}
button.dz{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.38}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:90px;resize:vertical}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.show{display:flex}
header{display:flex;align-items:center;gap:8px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
.seg{display:flex;gap:6px;padding:8px;background:var(--panel)}
.seg button{flex:1}
.searchRow{padding:0 8px 8px;background:var(--panel)}
#list{flex:1;overflow-y:auto;padding:8px 8px 16px;-webkit-overflow-scrolling:touch}
.cat{margin:10px 0 4px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;margin:6px 0;cursor:pointer}
.row .th{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:#0003}
.row .th svg{width:100%;height:100%;display:block}
.row .tx{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .more{min-width:48px;font-size:22px;font-weight:900}
.empty{color:var(--muted);font-size:14px;padding:6px 4px}
.foot{display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.foot button{flex:1}
#edName{flex:1;min-width:0;justify-content:flex-start;font-weight:800;font-size:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;text-align:left;line-height:42px}
#stage{flex:1;min-height:0;position:relative;background:var(--bg)}
#court{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#stepBar{display:flex;gap:6px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
#steps{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
#steps button{flex:none;min-width:50px;font-weight:700}
.tools{display:grid;gap:5px;padding:5px 8px;background:var(--panel)}
#modes{grid-template-columns:repeat(6,1fr)}
#acts{grid-template-columns:repeat(7,1fr);padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tools button{flex-direction:column;gap:1px;padding:2px 0;min-height:52px;font-size:11px;font-weight:600}
.tools button svg{width:30px;height:20px}
.tools button b{font-size:17px;line-height:20px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 10px;font-size:19px}
#sheet label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:700}
.btnCol{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btnRow{display:flex;gap:8px;margin-top:12px}
.btnRow button{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pngs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#fff}
.pngs .it{margin:8px 0}
.pngs a{display:inline-block;margin-top:6px;color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#animLbl{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:4px 12px;border-radius:999px;font-weight:800;font-size:14px;display:none;pointer-events:none}
#printArea{display:none}
@media print{
 html,body{height:auto;overflow:visible;background:#fff;color:#000;display:block}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block;font-family:Arial,sans-serif}
 #printArea h1{font-size:22px;margin:0 0 4px}
 #printArea .pm{font-size:12px;color:#444;margin-bottom:6px}
 #printArea .pn{font-size:13px;white-space:pre-wrap;margin:6px 0 10px}
 #printArea .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 #printArea figure{margin:0;break-inside:avoid}
 #printArea img{width:100%;border:1px solid #999}
 #printArea figcaption{font-size:12px;font-weight:700;margin-top:2px}
}
@media (min-width:700px){.tools button{min-height:56px;font-size:12px}#toast{bottom:210px}}
</style></head><body>
<section id="listView" class="view show">
 <header><h1 id="appTitle">Clarkston Playbook</h1><button id="themeBtn" aria-label="Court">Court</button></header>
 <div class="seg" id="teamSeg"></div>
 <div class="searchRow"><input id="search" type="search" placeholder="Search plays, tags, notes" autocomplete="off"></div>
 <div id="list"></div>
 <div class="foot"><button id="newBtn" class="pri">+ New play</button><button id="exportBtn">Backup</button><button id="importBtn">Restore</button></div>
 <input id="importFile" type="file" accept=".json,application/json" hidden>
</section>
<section id="editView" class="view">
 <header><button id="backBtn" aria-label="Back to plays">&#8249; Plays</button><button id="edName"></button><button id="courtBtn">Half</button><button id="moreBtn" aria-label="More">&#8943;</button></header>
 <div id="stage"><svg id="court" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><g id="gFloor"></g><g id="gLines"></g><g id="gPlayers"></g><g id="gBall"></g><g id="gHandles"></g></svg><div id="animLbl"></div></div>
 <div id="stepBar"><div id="steps"></div><button id="addStep">+ Step</button><button id="playBtn" class="pri">&#9654; Play</button></div>
 <div class="tools" id="modes"></div>
 <div class="tools" id="acts"></div>
</section>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

function clampPt(p){const L=ed.C.L;return[f2(Math.max(-27,Math.min(27,p[0]))),f2(Math.max(-3.6,Math.min(L+(ed.C.kind==='full'?3.6:1.5),p[1])))]}
function nearestPlayer(F,p,maxD,exclude){let best=null,bd=maxD;for(const q of F.players){if(q.id===exclude)continue;const cands=[[q.x,q.y]];const e=endOf(F,q.id);if(e)cands.push(e);for(const c of cands){const d=dist(c,p);if(d<bd){bd=d;best=q}}}return best}
svg.addEventListener('pointerdown',e=>{if(!ed||ed.anim)return;if(e.button>0)return;const t=e.target,p=evPt(e),F=curF();
 const h=t.closest('[data-h]'),pg=t.closest('[data-id]'),bg=t.closest('[data-ball]'),lg=t.closest('[data-lid]');
 svg.setPointerCapture(e.pointerId);
 if(h&&ed.sel&&ed.sel.type==='line'){ed.drag={kind:'handle',h:h.dataset.h,lid:ed.sel.id,start:p,moved:false};return}
 const fromId=pg?pg.dataset.id:(bg&&F.ball&&F.ball.holder?F.ball.holder:null);
 if(ed.mode!=='move'&&fromId){ed.drawing={type:ed.mode,from:fromId,pts:[[pById(F,fromId).x,pById(F,fromId).y]],start:p};return}
 if(bg&&ed.mode==='move'){ed.drag={kind:'ball',start:p,pos:ballPos(F,F.ball),moved:false};return}
 if(pg){ed.drag={kind:'player',id:pg.dataset.id,start:p,off:[pById(F,pg.dataset.id).x-p[0],pById(F,pg.dataset.id).y-p[1]],moved:false};return}
 if(lg){ed.sel={type:'line',id:lg.dataset.lid};edRender();return}
 if(bg){ed.sel={type:'ball'};edRender();return}
 if(ed.mode!=='move')toast('Start the line on a player');
 ed.sel=null;edRender()});
svg.addEventListener('pointermove',e=>{if(!ed||ed.anim)return;const d=ed.drag,dr=ed.drawing;if(!d&&!dr)return;const p=evPt(e),F=curF();
 if(dr){const last=dr.pts[dr.pts.length-1];if(dist(last,p)>=.35){dr.pts.push(clampPt(p));edRender()}return}
 if(!d.moved){if(dist(p,d.start)<.5)return;d.moved=true;if(d.kind!=='ball'||F.ball)pushUndo()}
 if(d.kind==='player'){const pl=pById(F,d.id);const q=clampPt([p[0]+d.off[0],p[1]+d.off[1]]);pl.x=q[0];pl.y=q[1];ed.sel={type:'player',id:d.id};edRender()}
 else if(d.kind==='ball'){d.pos=clampPt(p);if(F.ball)F.ball={x:d.pos[0],y:d.pos[1]};ed.sel={type:'ball'};edRender()}
 else if(d.kind==='handle'){const l=F.lines.find(l=>l.id===d.lid);if(!l)return;const g=lineGeom(F,l);const q=clampPt(p);
  if(d.h==='mid')l.pts=[g.start,q,g.end].map(a=>[f2(a[0]),f2(a[1])]);else{delete l.to;l.pts[l.pts.length-1]=q}edRender()}});
function endPointer(e){if(!ed)return;const d=ed.drag,dr=ed.drawing,F=curF();ed.drag=null;ed.drawing=null;
 if(dr){const P=dr.pts;if(plen(P)<2.2){ed.sel={type:'player',id:dr.from};edRender();return}
  pushUndo();const pts=smoothPts(P);const l={id:uid(),type:dr.type,from:dr.from,pts};
  if(dr.type==='pass'||dr.type==='handoff'){const tgt=nearestPlayer(F,pts[pts.length-1],3.4,dr.from);if(tgt){l.to=tgt.id;pts[pts.length-1]=[tgt.x,tgt.y]}}
  if(MOVES.has(l.type))F.lines=F.lines.filter(x=>!(x.from===l.from&&MOVES.has(x.type)));
  F.lines.push(l);ed.sel={type:'line',id:l.id};changed();return}
 if(!d)return;
 if(d.kind==='player'){if(!d.moved){ed.sel={type:'player',id:d.id};edRender();return}const pl=pById(F,d.id);F.lines.forEach(l=>{if(l.from===d.id)l.pts[0]=[pl.x,pl.y]});changed();return}
 if(d.kind==='ball'){if(!d.moved){ed.sel={type:'ball'};edRender();return}const tgt=nearestPlayer(F,d.pos,2.8);F.ball=tgt?{holder:tgt.id}:{x:d.pos[0],y:d.pos[1]};ed.sel=null;changed();return}
 if(d.kind==='handle'){if(!d.moved){edRender();return}const l=F.lines.find(l=>l.id===d.lid);
  if(l&&d.h==='end'&&(l.type==='pass'||l.type==='handoff')){const tgt=nearestPlayer(F,l.pts[l.pts.length-1],3.4,l.from);if(tgt){l.to=tgt.id;l.pts[l.pts.length-1]=[tgt.x,tgt.y]}}
  changed()}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
/* toolbar */
$('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b||!ed)return;stopAnim();ed.mode=b.dataset.mode;edRender();if(ed.mode!=='move')toast('Drag from a player to draw a '+b.dataset.mode)});
$('#acts').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!ed||b.disabled)return;stopAnim();act(b.dataset.act)});
function act(k){const F=curF();
 if(k==='undo'&&ed.undo.length){ed.redo.push(snap());restore(ed.undo.pop())}
 else if(k==='redo'&&ed.redo.length){ed.undo.push(snap());restore(ed.redo.pop())}
 else if(k==='addO'||k==='addX'){const t=k==='addO'?'o':'d';const n=[1,2,3,4,5].find(n=>!pById(F,t+n));if(!n){toast('All 5 are on the floor');return}pushUndo();
  let pos;if(t==='o')pos=OFF5[n];else{const o=pById(F,'o'+n);pos=o?manSpot([o.x,o.y]):SETS.zone23.d[n]}
  if(ed.play.court==='full'&&t==='o'&&!F.players.length)pos=OFF5[n];F.players.push(mkP(t,n,pos[0],pos[1]));ed.sel={type:'player',id:t+n};
  if(t==='o'&&!F.ball)F.ball={holder:'o'+n};changed()}
 else if(k==='ball'){const s=ed.sel;if(s&&s.type==='player'){pushUndo();F.ball={holder:s.id};changed();toast('Ball to '+(pById(F,s.id).t==='o'?'':'X')+pById(F,s.id).n)}
  else if(!F.ball){const o=F.players.find(p=>p.t==='o')||F.players[0];pushUndo();F.ball=o?{holder:o.id}:{x:0,y:20};changed()}
  else toast('Select a player, then tap Ball')}
 else if(k==='set')setSheet();
 else if(k==='del')delSel()}
function delSel(){const s=ed.sel,F=curF();if(!s)return;pushUndo();
 if(s.type==='line')F.lines=F.lines.filter(l=>l.id!==s.id);
 else if(s.type==='ball')F.ball=null;
 else if(s.type==='player'){const pl=pById(F,s.id);F.lines=F.lines.filter(l=>l.from!==s.id);F.lines.forEach(l=>{if(l.to===s.id){l.pts[l.pts.length-1]=[pl.x,pl.y];delete l.to}});
  if(F.ball&&F.ball.holder===s.id)F.ball={x:f2(pl.x+1.25),y:f2(pl.y-1.25)};F.players=F.players.filter(p=>p.id!==s.id)}
 ed.sel=null;changed()}
document.addEventListener('keydown',e=>{if(!ed||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.key==='Delete'||e.key==='Backspace')&&ed.sel){e.preventDefault();delSel()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();act(e.shiftKey?'redo':'undo')}});
function setSheet(){openSheet(`<h2>Quick set</h2><p style="color:var(--muted);font-size:13px;margin:0">Places players in this step (moves them if already on the floor).</p><div class="btnCol">${Object.entries(SETS).map(([k,s])=>`<button data-set="${k}">${s.label}</button>`).join('')}<button data-set="x">Cancel</button></div>`,s=>s.addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;closeSheet();if(b.dataset.set==='x')return;pushUndo();applySet(curF(),b.dataset.set);ed.sel=null;changed()}))}
/* steps */
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b||!ed)return;stopAnim();ed.fi=+b.dataset.step;ed.sel=null;edRender(true)});
$('#addStep').addEventListener('click',()=>{if(!ed)return;stopAnim();pushUndo();const N=nextFrame(curF());ed.play.frames.splice(ed.fi+1,0,N);ed.fi++;ed.sel=null;changed(true);toast('Step '+(ed.fi+1)+': players moved to their arrow ends')});
$('#courtBtn').addEventListener('click',()=>{if(!ed)return;stopAnim();pushUndo();ed.play.court=ed.play.court==='full'?'half':'full';ed.sel=null;changed(true)});
$('#edName').addEventListener('click',()=>{if(!ed)return;detailsSheet(ed.play,()=>edRender(true))});
$('#moreBtn').addEventListener('click',()=>{if(!ed)return;stopAnim();const p=ed.play;
 openSheet(`<h2>${esc(p.name)}</h2><div class="btnCol"><button data-a="png" class="pri">Save as image (PNG, each step)</button><button data-a="print">Print / PDF</button><button data-a="details">Details (category, tags, notes)</button>
 ${settings.theme==='clarkston'?`<button data-a="floor">Court: ${floorFor()==='clarkston'?'Clarkston floor → switch to drawn':'Drawn → switch to Clarkston floor'}</button>`:''}
 <div class="grid2"><button data-a="clearL">Clear lines (this step)</button><button data-a="clearA">Clear step</button></div>
 <button data-a="delStep" class="dz" ${p.frames.length<2?'disabled':''}>Delete step ${ed.fi+1}</button><button data-a="x">Cancel</button></div>`,s=>s.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a||a.disabled)return;const k=a.dataset.a,F=curF();
  if(k==='x')closeSheet();
  else if(k==='png'){closeSheet();pngSheet()}
  else if(k==='print'){closeSheet();printPlay(p)}
  else if(k==='details'){closeSheet();detailsSheet(p,()=>edRender(true))}
  else if(k==='floor'){settings.clkFloor=floorFor()==='clarkston'?'drawn':'image';saveSettings();closeSheet();edRender(true)}
  else if(k==='clearL'){pushUndo();F.lines=[];ed.sel=null;closeSheet();changed()}
  else if(k==='clearA'){if(!confirm('Remove all players, lines and the ball from step '+(ed.fi+1)+'?'))return;pushUndo();F.lines=[];F.players=[];F.ball=null;ed.sel=null;closeSheet();changed()}
  else if(k==='delStep'){if(!confirm('Delete step '+(ed.fi+1)+'?'))return;pushUndo();p.frames.splice(ed.fi,1);ed.fi=Math.max(0,ed.fi-1);ed.sel=null;closeSheet();changed(true)}}))});
/* ---------- animation ---------- */
const STEP_MS=1500,PAUSE_MS=350,END_PAUSE_MS=600;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function planStep(F,N){const chain=ballChain(F);const passers=new Set(chain.ev.map(v=>v.from));const plan={};
 for(const p of F.players){const m=moveLine(F,p.id);const path=m?movePath(F,m):[[p.x,p.y],[p.x,p.y]];const n=pById(N,p.id);const end=path[path.length-1];
  plan[p.id]={path,L:plen(path),fix:n?[n.x-end[0],n.y-end[1]]:[0,0],w:(m&&passers.has(p.id))?.55:1,gone:!n}}
 const holderMoves=chain.ev.length&&F.ball&&F.ball.holder&&moveLine(F,F.ball.holder);const s0=holderMoves?.55:(chain.ev.length?.3:0);
 return{plan,chain,s0,appear:N.players.filter(p=>!pById(F,p.id))}}
function posAt(pp,t){const tt=ease(Math.min(1,t/pp.w));const q=at(pp.path,pp.L*tt);const e=ease(t);return[q[0]+pp.fix[0]*e,q[1]+pp.fix[1]*e]}
/* the last step's lines animate into a virtual ending frame (never saved to the play) */
function animNext(P,i){return P.frames[i+1]||nextFrame(P.frames[i])}
function animTotal(P){const L=P.frames[P.frames.length-1];return P.frames.length-1+(L.lines.length?1:0)}
function animLabel(P,i){return 'Step '+(i+1)+' → '+(i+1>=P.frames.length?'end':i+2)}
function animFrame(i,t){const P=ed.play,F=P.frames[i],N=animNext(P,i),C=ed.C;const S=ed.anim.plans[i]||(ed.anim.plans[i]=planStep(F,N));
 const pos={};for(const p of F.players)pos[p.id]=posAt(S.plan[p.id],t);
 const bp=id=>pos[id]?[pos[id][0]+1.25,pos[id][1]-1.25]:null;let ball=null;
 if(F.ball){if(!S.chain.ev.length)ball=F.ball.holder?bp(F.ball.holder):(N.ball&&!N.ball.holder?[F.ball.x+(N.ball.x-F.ball.x)*ease(t),F.ball.y+(N.ball.y-F.ball.y)*ease(t)]:[F.ball.x,F.ball.y]);
  else{const n=S.chain.ev.length,span=(1-S.s0)/n;if(t<S.s0)ball=bp(F.ball.holder);else{const k=Math.min(n-1,Math.floor((t-S.s0)/span)),v=S.chain.ev[k],ks=S.s0+k*span,s=Math.min(1,(t-ks)/span);
   const A=(()=>{const tk=Math.min(1,ks);const pp=S.plan[v.from];const q=posAt(pp,tk);return[q[0]+1.25,q[1]-1.25]})();const Bp=v.to?bp(v.to):v.end;ball=[A[0]+(Bp[0]-A[0])*ease(s),A[1]+(Bp[1]-A[1])*ease(s)]}}}
 else if(N.ball)ball=null;
 const lines=F.lines.map(l=>lineSVG(C,F,l,{nohit:true,op:.28})).join('');
 $('#gLines').innerHTML=lines;
 $('#gPlayers').innerHTML=F.players.map(p=>playerSVG(C,Object.assign({},p,{x:pos[p.id][0],y:pos[p.id][1]}),{nohit:true,op:S.plan[p.id].gone?(1-t):null})).join('')+S.appear.map(p=>playerSVG(C,p,{nohit:true,op:t})).join('');
 $('#gBall').innerHTML=ballSVG(C,ball,{nohit:true});$('#gHandles').innerHTML='';
 ed.anim.lastBall=ball;ed.anim.lastPos=pos}
function animate(){if(!ed)return;if(ed.anim){stopAnim();return}const P=ed.play;const total=animTotal(P);if(total<1){toast('Add a step first (+ Step), then Play');return}
 const start=ed.fi>=total?0:ed.fi;ed.sel=null;ed.anim={i:start,t0:performance.now(),plans:{}};$('#playBtn').innerHTML='&#9632; Stop';$('#animLbl').style.display='block';
 const tick=now=>{if(!ed||!ed.anim)return;const A=ed.anim;let el=now-A.t0;if(el>=STEP_MS+(A.i>=total-1?END_PAUSE_MS:PAUSE_MS)){A.i++;A.t0=now;el=0;if(A.i>=total){ed.fi=0;stopAnim();return}} /* finished: hold final frame, then back to step 1 */
  ed.fi=A.i;$('#animLbl').textContent=animLabel(P,A.i);document.querySelectorAll('#steps button').forEach((b,j)=>b.classList.toggle('on',j===A.i));
  animFrame(A.i,Math.min(1,el/STEP_MS));A.raf=requestAnimationFrame(tick)};
 ed.anim.raf=requestAnimationFrame(tick)}
function stopAnim(){if(!ed||!ed.anim)return;cancelAnimationFrame(ed.anim.raf);ed.anim=null;$('#playBtn').innerHTML='&#9654; Play';$('#animLbl').style.display='none';edRender(true)}
$('#playBtn').addEventListener('click',animate);
/* ---------- PNG / print ---------- */
async function framePNG(p,i,o={}){const C=makeCourt(p.court,o.floor||floorFor()),T=theme(),F=p.frames[i];const vb=C.vb;
 const W=o.w||(p.court==='full'?1000:1400),H=Math.round(W*vb[3]/vb[2]),head=Math.round(W*.075);
 const s=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="${vb.join(' ')}">${frameSVG(C,F,T)}</svg>`;
 const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));const img=new Image();img.src=url;
 try{await img.decode()}catch(e){await new Promise((r,j)=>{img.onload=r;img.onerror=j})}
 const cv=document.createElement('canvas');cv.width=W;cv.height=H+head;const x=cv.getContext('2d');
 x.fillStyle=T.vars.panel;x.fillRect(0,0,W,head);x.fillStyle=T.vars.acc==='#ffffff'?'#fff':T.vars.acc;x.font=`800 ${Math.round(head*.42)}px Arial,Helvetica,sans-serif`;x.textBaseline='middle';
 x.fillText(p.name,head*.35,head/2);x.font=`700 ${Math.round(head*.32)}px Arial,Helvetica,sans-serif`;x.fillStyle='#fff';x.textAlign='right';x.fillText('Step '+(i+1)+' of '+p.frames.length,W-head*.35,head/2);
 x.drawImage(img,0,head,W,H);URL.revokeObjectURL(url);return cv.toDataURL('image/png')}
const fileBase=p=>(p.name||'play').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'play';
async function pngSheet(){const p=ed.play;openSheet(`<h2>Images</h2><p style="color:var(--muted)">Making images…</p>`);
 const urls=[];for(let i=0;i<p.frames.length;i++)urls.push(await framePNG(p,i));window.__lastPNGs=urls;
 openSheet(`<h2>${esc(p.name)} – images</h2><p style="color:var(--muted);font-size:13px;margin:0">On iPhone/iPad, press and hold an image to save it to Photos.</p><div class="pngs">${urls.map((u,i)=>`<div class="it"><img src="${u}" alt="Step ${i+1}"><a href="${u}" download="${fileBase(p)}-step${i+1}.png">Download step ${i+1}</a></div>`).join('')}</div><div class="btnRow"><button data-a="all">Download all</button><button data-a="x" class="pri">Done</button></div>`,s=>s.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='x')closeSheet();else urls.forEach((u,i)=>setTimeout(()=>download(fileBase(p)+'-step'+(i+1)+'.png',u),i*400))}))}
async function printPlay(p){toast('Preparing print…');const urls=[];for(let i=0;i<p.frames.length;i++)urls.push(await framePNG(p,i,{w:900}));
 $('#printArea').innerHTML=`<h1>${esc(p.name)}</h1><div class="pm">${esc(CATNAME[p.cat]||'')} · ${TEAMS.find(t=>t[0]===settings.team)[1]}${(p.tags||[]).length?' · '+esc(p.tags.join(', ')):''}</div>${p.notes?`<div class="pn">${esc(p.notes)}</div>`:''}<div class="pg">${urls.map((u,i)=>`<figure><img src="${u}"><figcaption>Step ${i+1}</figcaption></figure>`).join('')}</div>`;
 await Promise.all([...document.querySelectorAll('#printArea img')].map(im=>im.decode().catch(()=>{})));setTimeout(()=>window.print(),50)}

applyTheme();loadTeam();renderList();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/playbook\.html$/i.test(location.pathname))navigator.serviceWorker.register('sw.js').catch(()=>{});
